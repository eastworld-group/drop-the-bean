<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Drop the Bean">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#BFE6FF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Drop the Bean</title>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #BFE6FF;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; }
  /* the cat's name: a real text box, so the phone keyboard works */
  #nameInput {
    position: fixed; display: none; box-sizing: border-box;
    border: 3px solid #FF8A1F; border-radius: 21px; outline: none;
    background: #FFFFFF; color: #252A5C; text-align: center;
    font: 800 20px ui-rounded, "SF Pro Rounded", -apple-system, "Helvetica Neue", system-ui, sans-serif;
    -webkit-user-select: text; user-select: text;
  }
  #nameInput::placeholder { color: #9AA3CC; }
  /* Name and backup screen: your name, your code, and a box to paste a code into */
  #playerInput, #codeBox, #restoreBox {
    position: fixed; display: none; box-sizing: border-box; margin: 0;
    border: 3px solid #8FB4E3; border-radius: 18px; outline: none;
    background: #FFFFFF; color: #252A5C;
    -webkit-user-select: text; user-select: text;
  }
  #playerInput { text-align: center; font: 800 20px ui-rounded, "SF Pro Rounded", -apple-system, "Helvetica Neue", system-ui, sans-serif; }
  #codeBox, #restoreBox { padding: 8px 12px; resize: none; overflow: auto; word-break: break-all; font: 16px/1.25 ui-monospace, Menlo, monospace; }
  #playerInput:focus, #restoreBox:focus { border-color: #FF8A1F; }
  #playerInput::placeholder, #restoreBox::placeholder { color: #9AA3CC; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<input id="nameInput" type="text" maxlength="12" autocomplete="off" autocapitalize="words" spellcheck="false" aria-label="Your cat's name">
<input id="playerInput" type="text" maxlength="16" autocomplete="off" autocapitalize="words" spellcheck="false" placeholder="Type your name" aria-label="Your name">
<textarea id="codeBox" readonly spellcheck="false" aria-label="Your backup code"></textarea>
<textarea id="restoreBox" spellcheck="false" autocomplete="off" autocapitalize="off" placeholder="BEAN-..." aria-label="Paste a backup code"></textarea>
<script src="levels-data.js"></script>
<script src="js/core.js"></script>
<script src="js/art.js"></script>
<script src="js/play.js"></script>
<script src="js/screens.js"></script>
<script src="js/room.js"></script>
<script src="js/kitchen.js"></script>
<script src="js/kitchen-things.js"></script>
<script src="js/garden.js"></script>
<script src="js/garden-things.js"></script>
<script src="js/notes.js"></script>
<script src="js/album.js"></script>
<script src="js/main.js"></script>
</body>
</html>
