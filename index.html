<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Drop the Bean">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#BFE6FF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Drop the Bean</title>
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #BFE6FF;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script src="levels-data.js"></script>
<script>
"use strict";

/* ==================================================================
   DROP THE BEAN
   Cats sleep curled up like beans. Slide each bed over the cats of
   its own color. A full bed wakes its cats and leaves the board.
   Tuck in every cat before time runs out.
   Levels live in levels-data.js (made and checked by tools/levels.js).
=================================================================== */

const LEVELS = window.LEVELS || [];

/* ---------- the cast: Bean the black and white cat, and friends ---------- */
const CATS = {
  o: { name: "Pinto",  fur: "#FFA63D", dark: "#B9590A", light: "#FFE3B8", bed: "#FF8A1F", face: "#4A2A12" },
  b: { name: "Navy",   fur: "#5AA9FF", dark: "#1F57B0", light: "#DCEBFF", bed: "#3B8BEF", face: "#16335F" },
  w: { name: "Butter", fur: "#FFFFFF", dark: "#7F8BB8", light: "#FFFFFF", bed: "#C5CFEE", face: "#3A3F66" },
  k: { name: "Bean",   fur: "#2C2C3A", dark: "#0B0B12", light: "#FFFFFF", bed: "#4A4A63", face: "#1B1B28", lid: "#F2F2FA", eye: "#FFE35A", tip: "#FFFFFF", bedIn: "#D4D4E6" },
  p: { name: "Jelly",  fur: "#B981FF", dark: "#6431BD", light: "#EFE2FF", bed: "#9C5BF4", face: "#35176E", ear: "#8E55E6", tail: "#8E55E6" },
  m: { name: "Eda",    fur: "#82DD5C", dark: "#35891E", light: "#E1F8D3", bed: "#5FCB36", face: "#1E4D12" },
};
const CAST = ["k", "o", "b", "w", "p", "m"];
const CHAPTER_NAMES = ["Nap Time", "On Rails", "Lock and Key", "Full House"];
const PAIR = [["#FFC93C", "#8A5A00"], ["#FF7EB6", "#A02567"]];   // lock-and-key pair colors
const INK = "#252A5C";
const SOFT = "#5F6AA6";
const FONT = 'ui-rounded, "SF Pro Rounded", -apple-system, "Helvetica Neue", system-ui, sans-serif';
const PER_PAGE = 25;
const LEAVE = 0.95;          // seconds a full bed takes to wake up, cheer and go
const lerp = (a, b, t) => a + (b - a) * t;
const clamp01 = v => Math.max(0, Math.min(1, v));

/* ---------- canvas ---------- */
const cv = document.getElementById("game");
const ctx = cv.getContext("2d");
let W = 0, H = 0;

const probe = document.createElement("div");
probe.style.cssText = "position:fixed;top:0;left:0;visibility:hidden;pointer-events:none;" +
  "padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);";
document.body.appendChild(probe);
function safeArea() {
  const cs = getComputedStyle(probe);
  return { t: parseFloat(cs.paddingTop) || 0, b: parseFloat(cs.paddingBottom) || 0 };
}

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  layout();
}
window.addEventListener("resize", resize);
document.addEventListener("gesturestart", e => e.preventDefault());
document.addEventListener("contextmenu", e => e.preventDefault());

/* ---------- saved on this device: stars and sound choice ---------- */
function readStore(key, fallback) { try { const v = localStorage.getItem(key); return v === null ? fallback : v; } catch (e) { return fallback; } }
function writeStore(key, value) { try { localStorage.setItem(key, value); } catch (e) { /* private mode: play on without saving */ } }
let progress = {};
try { progress = JSON.parse(readStore("dropthebean.stars", "{}")) || {}; } catch (e) { progress = {}; }
function saveStars(i, stars) {
  if ((progress[i] || 0) >= stars) return;
  progress[i] = stars;
  writeStore("dropthebean.stars", JSON.stringify(progress));
}

/* ---------- sound (made on the fly, no audio files) ---------- */
let soundOn = readStore("dropthebean.sound", "on") !== "off";
let musicOn = readStore("dropthebean.music", "on") !== "off";
let timerMode = readStore("dropthebean.timer", "on") !== "off";     // off = relaxed mode, no countdown
let shapesOn = readStore("dropthebean.shapes", "off") === "on";     // a shape per color, for color-blind players
let themeId = readStore("dropthebean.theme", "sky");
let daily = {};
try { daily = JSON.parse(readStore("dropthebean.daily", "{}")) || {}; } catch (e) { daily = {}; }

// Boards are the reward for stars.
const THEMES = [
  { id: "sky",    name: "Sky",    stars: 0,   bg: ["#A9DCFF", "#E3F4FF"], tray: "#4A5BC4", trayDark: "#2B3783", wall: "#6577DC", wallDark: "#35449E", tiles: ["#F4F7FF", "#E5EBFC"] },
  { id: "sunset", name: "Sunset", stars: 30,  bg: ["#FFC2A1", "#FFF0DC"], tray: "#C4573B", trayDark: "#8C3521", wall: "#E07A5F", wallDark: "#A6452D", tiles: ["#FFF8F0", "#FBE8D8"] },
  { id: "garden", name: "Garden", stars: 90,  bg: ["#A8E6C4", "#EAFBF1"], tray: "#2F8F6B", trayDark: "#1D6349", wall: "#4DB58D", wallDark: "#247256", tiles: ["#F5FFF9", "#E0F5E9"] },
  { id: "dusk",   name: "Dusk",   stars: 180, bg: ["#A7A2F0", "#E4DDFF"], tray: "#3B2F8F", trayDark: "#241C63", wall: "#5B4DC0", wallDark: "#30267A", tiles: ["#F7F5FF", "#E7E2FA"] },
];
const theme = () => { const t = THEMES.find(q => q.id === themeId); return t && totalStars() >= t.stars ? t : THEMES[0]; };

const todayKey = d => { d = d || new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
function dailyIndex() { let h = 7; for (const ch of todayKey()) h = (h * 31 + ch.charCodeAt(0)) % 100003; return 5 + h % Math.max(1, LEVELS.length - 5); }
const dailyDone = () => daily.last === todayKey();
function dailyStreak() {
  if (dailyDone()) return daily.streak || 1;
  const y = new Date(); y.setDate(y.getDate() - 1);
  return daily.last === todayKey(y) ? (daily.streak || 0) : 0;
}
function markDaily() {
  if (dailyDone()) return;
  daily = { last: todayKey(), streak: dailyStreak() + 1 };
  writeStore("dropthebean.daily", JSON.stringify(daily));
}
let actx = null;
function audio() {
  if (!actx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    try { actx = new AC(); } catch (e) { return null; }
  }
  if (actx.state === "suspended") actx.resume();
  return actx;
}
function tone(freq, dur, o) {
  o = o || {};
  if (!(o.music ? musicOn : soundOn)) return;
  const a = audio(); if (!a) return;
  const osc = a.createOscillator(), g = a.createGain(), t0 = o.at || a.currentTime + (o.delay || 0);
  osc.type = o.type || "sine";
  osc.frequency.setValueAtTime(freq, t0);
  if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(o.vol || 0.15, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(g); g.connect(a.destination);
  osc.start(t0); osc.stop(t0 + dur + 0.03);
}
let lastBump = 0;
const sfx = {
  slide: () => tone(320, 0.04, { type: "triangle", vol: 0.05 }),
  tuck:  () => tone(520, 0.13, { to: 900, vol: 0.16 }),
  done:  () => { tone(660, 0.14, { vol: 0.14 }); tone(990, 0.22, { vol: 0.14, delay: 0.1 }); },
  win:   () => [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.24, { vol: 0.15, delay: 0.1 + i * 0.11, type: "triangle" })),
  lose:  () => [392, 330, 262].forEach((f, i) => tone(f, 0.3, { vol: 0.13, delay: i * 0.16, type: "triangle" })),
  bump:  () => { if (time - lastBump > 0.25) { lastBump = time; tone(120, 0.07, { type: "square", vol: 0.04 }); } },
  tick:  () => tone(880, 0.05, { vol: 0.07 }),
  tap:   () => tone(440, 0.05, { vol: 0.07, type: "triangle" }),
  undo:  () => tone(500, 0.1, { to: 300, vol: 0.1, type: "triangle" }),
  unlock: () => { tone(700, 0.08, { vol: 0.12, type: "square", delay: 0.2 }); tone(1100, 0.16, { vol: 0.12, type: "triangle", delay: 0.28 }); },
};

// A soft lullaby loop, played note by note.
const SONG = { beat: 0.42,
  lead: [659, 0, 587, 523, 440, 0, 392, 0, 440, 523, 587, 0, 523, 0, 0, 0, 587, 0, 523, 440, 392, 0, 330, 0, 392, 440, 523, 0, 440, 0, 0, 0],
  bass: [131, 110, 87.3, 98, 131, 110, 87.3, 98] };
let songAt = 0, songStep = 0;
function musicTick() {
  if (!musicOn || !actx || actx.state !== "running") return;
  if (songAt < actx.currentTime) songAt = actx.currentTime + 0.08;
  while (songAt < actx.currentTime + 0.25) {
    const i = songStep % SONG.lead.length;
    if (SONG.lead[i]) tone(SONG.lead[i], 0.5, { at: songAt, vol: 0.03, type: "triangle", music: true });
    if (i % 4 === 0) tone(SONG.bass[i / 4], 1.5, { at: songAt, vol: 0.035, music: true });
    songAt += SONG.beat; songStep++;
  }
}

/* ---------- state ---------- */
let screen = "menu", page = 0;
let L = null, levelIndex = 0, rows = 0, cols = 0;
let walls = [], floorCats = [], beds = [], leaving = [], effects = [], confetti = [], buttons = [], history = [];
let catsLeft = 0, timeLeft = 0, timerOn = false, overlay = null, drag = null, touched = false, lastTick = 0;
let slides = 0, isDaily = false, guideRuns = [], guideIdx = 0, settingsOpen = false;
let cell = 60, gx = 0, gy = 0, topY = 0;
let time = 0;

function makeBed(id, r, c, need) {
  const src = L.beds[id];
  return { id, color: src.color, need, total: src.need, cells: src.cells, axis: src.axis, lock: src.lock,
    r, c, x: c, y: r, nx: 0, ny: 0, fills: new Array(src.need - need).fill(1), leaveT: 0 };
}

function startLevel(i, asDaily) {
  levelIndex = i; L = LEVELS[i]; isDaily = !!asDaily; slides = 0;
  rows = L.rows; cols = L.cols;
  walls = []; floorCats = []; catsLeft = 0;
  for (let r = 0; r < rows; r++) {
    walls[r] = []; floorCats[r] = [];
    for (let c = 0; c < cols; c++) {
      const ch = L.map[r][c];
      walls[r][c] = ch === "#";
      floorCats[r][c] = (ch !== "." && ch !== "#") ? { color: ch, seed: Math.random() * 10 } : null;
      if (floorCats[r][c]) catsLeft++;
    }
  }
  beds = L.beds.map((b, id) => makeBed(id, b.r, b.c, b.need));
  // the finger demo: where each demo drag starts and ends
  guideIdx = 0;
  const gp = {}; L.beds.forEach((b, id) => { gp[id] = [b.r, b.c]; });
  guideRuns = (L.guide || []).map(g => {
    const start = gp[g.bed].slice();
    const end = g.path.reduce((q, [dr, dc]) => [q[0] + dr, q[1] + dc], start);
    gp[g.bed] = end;
    return { bed: g.bed, path: g.path, start, end };
  });
  leaving = []; effects = []; confetti = []; history = [];
  drag = null; overlay = null; touched = false;
  timeLeft = L.time; timerOn = false; lastTick = 0;
  screen = "game";
  layout();
}

function layout() {
  const s = safeArea();
  topY = s.t + 8;
  if (screen !== "game" || !L) return;
  const top = topY + 120, bottom = (L.hint ? 84 : 36) + s.b;
  const availW = W - 52, availH = H - top - bottom;
  cell = Math.floor(Math.min(availW / cols, availH / rows, 86));
  gx = Math.round((W - cols * cell) / 2);
  gy = Math.round(top + Math.max(0, (availH - rows * cell) * 0.4));
}

/* ---------- undo ---------- */
function snapshot() {
  return {
    beds: beds.map(b => ({ id: b.id, r: b.r, c: b.c, need: b.need })),
    cats: floorCats.map(row => row.map(c => c ? { color: c.color, seed: c.seed } : null)),
    catsLeft, slides,
  };
}
function undo() {
  if (!history.length || overlay) return;
  const s = history.pop();
  beds = s.beds.map(b => makeBed(b.id, b.r, b.c, b.need));
  floorCats = s.cats; catsLeft = s.catsLeft; slides = s.slides;
  leaving = []; drag = null;
  sfx.undo();
}

/* ---------- rules ---------- */
function bedAtCell(r, c, except) {
  for (const b of beds) {
    if (b === except) continue;
    for (const [dr, dc] of b.cells) if (b.r + dr === r && b.c + dc === c) return b;
  }
  return null;
}

// A locked bed waits until its key bed is full and gone.
const isLocked = bed => bed.lock !== undefined && beds.some(b => b.id === bed.lock);
const pairOf = id => { const n = L.beds.filter(b => b.lock !== undefined).findIndex(b => b === L.beds[id]); return PAIR[Math.max(0, n) % PAIR.length]; };

// Can this bed slide one cell? Returns the cats it would tuck in, or null if blocked.
function canStep(bed, dr, dc) {
  if (bed.axis === "h" && dr) return null;        // rails: side to side only
  if (bed.axis === "v" && dc) return null;        // rails: up and down only
  if (isLocked(bed)) return null;
  const got = [];
  for (const [sr, sc] of bed.cells) {
    const r = bed.r + dr + sr, c = bed.c + dc + sc;
    if (r < 0 || c < 0 || r >= rows || c >= cols) return null;
    if (walls[r][c]) return null;
    if (bedAtCell(r, c, bed)) return null;
    const cat = floorCats[r][c];
    if (cat) {
      if (cat.color !== bed.color) return null;
      got.push([r, c]);
    }
  }
  if (got.length > bed.need) return null;
  return got;
}

function doStep(bed, dr, dc) {
  const got = canStep(bed, dr, dc);
  if (!got) return false;
  bed.r += dr; bed.c += dc; slides++;
  if (got.length) sfx.tuck(); else sfx.slide();
  for (const [r, c] of got) {
    floorCats[r][c] = null;
    bed.need--; catsLeft--;
    bed.fills.push(0);
    burst(gx + (c + 0.5) * cell, gy + (r + 0.5) * cell, "spark", CATS[bed.color].fur, 7);
  }
  if (bed.need === 0) {
    beds = beds.filter(b => b !== bed);
    bed.leaveT = 0;
    leaving.push(bed);
    if (drag && drag.bed === bed) drag = null;
    burst(gx + (bed.c + 0.5) * cell, gy + (bed.r + 0.5) * cell, "heart", "#FF5C8A", 5);
    sfx.done();
    for (const b of beds) if (b.lock === bed.id) {        // this was a key: its lock pops open
      burst(gx + (b.c + 0.5) * cell, gy + (b.r + 0.5) * cell, "spark", pairOf(b.id)[0], 12);
      sfx.unlock();
    }
  }
  if (catsLeft === 0 && !overlay) finish("win", LEAVE + 0.1);
  return true;
}

function finish(kind, delay) {
  timerOn = false; drag = null;
  let stars;
  if (timerMode) { const frac = timeLeft / L.time; stars = frac >= 0.5 ? 3 : frac >= 0.2 ? 2 : 1; }
  else { const ratio = slides / Math.max(1, L.best); stars = ratio <= 1.6 ? 3 : ratio <= 2.6 ? 2 : 1; }   // relaxed: fewer slides, more stars
  overlay = { kind, stars, delay, t: 0, left: timeLeft, rang: false, unlocked: null, daily: false };
  if (kind === "win") {
    const before = totalStars();
    saveStars(levelIndex, stars);
    const after = totalStars();
    overlay.unlocked = THEMES.find(t => t.stars > before && t.stars <= after) || null;
    if (isDaily) { markDaily(); overlay.daily = true; }
  }
}

function burst(x, y, type, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = 50 + Math.random() * 130;
    effects.push({ type, color, x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - (type === "heart" ? 110 : 30),
      life: type === "heart" ? 1.1 : 0.55, max: type === "heart" ? 1.1 : 0.55, rot: Math.random() * 6 });
  }
}
function throwConfetti() {
  const palette = CAST.map(k => CATS[k].fur).concat(["#FFD84D", "#FF5C8A"]);
  for (let i = 0; i < 70; i++) {
    confetti.push({ x: Math.random() * W, y: -20 - Math.random() * H * 0.4, vx: (Math.random() - 0.5) * 60,
      vy: 140 + Math.random() * 160, rot: Math.random() * 6, spin: (Math.random() - 0.5) * 10,
      w: 6 + Math.random() * 6, h: 8 + Math.random() * 8, color: palette[i % palette.length] });
  }
}

/* ---------- input ---------- */
let press = null;

function bedAtPoint(x, y) {
  const c = Math.floor((x - gx) / cell), r = Math.floor((y - gy) / cell);
  if (r < 0 || c < 0 || r >= rows || c >= cols) return null;
  return bedAtCell(r, c, null);
}

// Follow the finger: slide the held bed cell by cell toward it.
function dragTo(px, py) {
  const d = drag, bed = d.bed;
  const tr = (py - d.offY - gy) / cell, tc = (px - d.offX - gx) / cell;
  for (let i = 0; i < 14 && drag; i++) {
    const dr = tr - bed.r, dc = tc - bed.c;
    const tryRow = () => Math.abs(dr) > 0.55 && doStep(bed, Math.sign(dr), 0);
    const tryCol = () => Math.abs(dc) > 0.55 && doStep(bed, 0, Math.sign(dc));
    const moved = Math.abs(dc) >= Math.abs(dr) ? (tryCol() || tryRow()) : (tryRow() || tryCol());
    if (moved) {
      if (!d.saved) { history.push(d.snap); d.saved = true; }
      continue;
    }
    // blocked: lean into the obstacle so the player can see why
    if (Math.abs(dr) > 0.9 || Math.abs(dc) > 0.9) {
      if (Math.abs(dc) >= Math.abs(dr)) bed.nx = Math.sign(dc) * 0.09; else bed.ny = Math.sign(dr) * 0.09;
      sfx.bump();
    }
    break;
  }
}

cv.addEventListener("pointerdown", e => {
  if (soundOn || musicOn) audio();
  press = { x: e.clientX, y: e.clientY, moved: false };
  if (screen === "game" && !overlay) {
    const b = bedAtPoint(e.clientX, e.clientY);
    if (b) {
      drag = { bed: b, offX: e.clientX - (gx + b.c * cell), offY: e.clientY - (gy + b.r * cell), snap: snapshot(), saved: false };
      timerOn = true; touched = true;
      try { cv.setPointerCapture(e.pointerId); } catch (err) { /* fine without it */ }
    }
  }
});
cv.addEventListener("pointermove", e => {
  if (press && Math.hypot(e.clientX - press.x, e.clientY - press.y) > 10) press.moved = true;
  if (drag && !overlay) dragTo(e.clientX, e.clientY);
});
function release() {
  drag = null;
  if (press && !press.moved) {
    for (const b of buttons) {
      if (press.x >= b.x && press.x <= b.x + b.w && press.y >= b.y && press.y <= b.y + b.h) {
        press = null; sfx.tap(); b.onTap(); return;
      }
    }
  }
  press = null;
}
cv.addEventListener("pointerup", release);
cv.addEventListener("pointercancel", () => { drag = null; press = null; });

/* ==================================================================
   DRAWING
=================================================================== */
function addRR(x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function rr(x, y, w, h, r) { ctx.beginPath(); addRR(x, y, w, h, r); }
function oval(x, y, rx, ry, rot) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2); }

function paw(x, y, s) {
  oval(x, y + s * 0.25, s * 0.42, s * 0.34); ctx.fill();
  [[-0.42, -0.2], [-0.15, -0.45], [0.15, -0.45], [0.42, -0.2]].forEach(([a, b]) => {
    oval(x + a * s, y + b * s, s * 0.14, s * 0.18); ctx.fill();
  });
}

function drawStar(cx, cy, r, filled) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5, rad = i % 2 ? r * 0.46 : r;
    ctx.lineTo(cx + Math.cos(a) * rad, cy + Math.sin(a) * rad);
  }
  ctx.closePath();
  ctx.fillStyle = filled ? "#FFD23F" : "#DCE4F5";
  ctx.strokeStyle = filled ? "#D9920C" : "#BCC8E4";
  ctx.lineWidth = Math.max(1.2, r * 0.12); ctx.lineJoin = "round";
  ctx.fill(); ctx.stroke();
}

function drawHeart(x, y, s) {
  ctx.beginPath();
  ctx.moveTo(x, y + s * 0.3);
  ctx.bezierCurveTo(x - s * 0.6, y - s * 0.2, x - s * 0.25, y - s * 0.65, x, y - s * 0.25);
  ctx.bezierCurveTo(x + s * 0.25, y - s * 0.65, x + s * 0.6, y - s * 0.2, x, y + s * 0.3);
  ctx.fill();
}

/* ------------------------------------------------------------------
   A cat. wake = 0: asleep, curled up like a bean.
          wake = 1: awake, sitting up, tail wagging, little hops.
   Values in between blend the two poses, so cats visibly wake up.
------------------------------------------------------------------- */
function drawCat(cx, cy, s, key, o) {
  o = o || {};
  const C = CATS[key];
  const t = time + (o.seed || 0);
  const w = clamp01(o.wake || 0);
  const lw = Math.max(1.6, s * 0.042);
  const hop = w > 0.9 && !o.still ? Math.abs(Math.sin(t * 8)) * s * 0.07 : 0;
  ctx.save();
  ctx.translate(cx, cy);
  if (o.scale) ctx.scale(o.scale, o.scale);
  ctx.lineJoin = "round"; ctx.lineCap = "round";

  if (!o.noShadow) { ctx.fillStyle = "rgba(30, 40, 100, 0.16)"; oval(s * 0.02, s * 0.37, s * 0.34, s * 0.075); ctx.fill(); }
  ctx.translate(0, -hop);

  const breathe = 1 + Math.sin(t * 2.2) * 0.022 * (1 - w);
  const bx = lerp(0.06, 0, w) * s, by = lerp(0.1, 0.17, w) * s;
  const brx = lerp(0.34, 0.26, w) * s, bry = lerp(0.27, 0.22, w) * s;
  const hx = lerp(-0.09, 0, w) * s, hy = lerp(-0.09, -0.13, w) * s, hr = lerp(0.245, 0.27, w) * s;

  const tail = () => {
    const wag = Math.sin(t * 9) * 0.06 * w;
    const p = (a, b) => lerp(a, b, w) * s;
    const ex = p(-0.2, 0.38) + wag * s, ey = p(0.29, -0.12);
    ctx.beginPath();
    ctx.moveTo(p(0.36, 0.2), p(0.06, 0.3));
    ctx.bezierCurveTo(p(0.44, 0.42), p(0.38, 0.3), p(0.0, 0.5), p(0.44, 0.02), ex, ey);
    ctx.strokeStyle = C.dark; ctx.lineWidth = s * 0.15; ctx.stroke();
    ctx.strokeStyle = C.tail || C.fur; ctx.lineWidth = s * 0.15 - lw * 2; ctx.stroke();
    if (C.tip) { ctx.fillStyle = C.tip; oval(ex, ey, (s * 0.15 - lw * 2) / 2, (s * 0.15 - lw * 2) / 2); ctx.fill(); }
  };

  const body = () => {
    ctx.save();
    ctx.translate(bx, by); ctx.scale(breathe, breathe);
    oval(0, 0, brx, bry); ctx.fillStyle = C.fur; ctx.fill();
    ctx.save(); ctx.clip();
    if (key === "o") {                       // Pinto: tabby stripes
      ctx.strokeStyle = C.dark; ctx.lineWidth = s * 0.05;
      [-1.05, -0.6, -0.15, 0.3].forEach(a => {
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * brx, Math.sin(a) * bry);
        ctx.lineTo(Math.cos(a) * brx * 0.58, Math.sin(a) * bry * 0.58);
        ctx.stroke();
      });
    } else if (key === "b" || key === "m") { // Navy, Eda: pale belly
      ctx.fillStyle = C.light; oval(0, bry * 0.45, brx * 0.62, bry * 0.55); ctx.fill();
    } else if (key === "w") {                // Butter: one toasted patch
      ctx.fillStyle = "#FFCB7A"; oval(brx * 0.5, -bry * 0.35, brx * 0.42, bry * 0.45, 0.5); ctx.fill();
    } else if (key === "k") {                // Bean: white chest
      ctx.fillStyle = C.light; oval(lerp(-0.35, 0, w) * brx, bry * 0.4, brx * 0.5, bry * 0.62); ctx.fill();
    } else if (key === "p") {                // Jelly: pale middle, dark points
      ctx.fillStyle = C.light; oval(0, bry * 0.1, brx * 0.62, bry * 0.66); ctx.fill();
    }
    ctx.restore();
    oval(0, 0, brx, bry); ctx.strokeStyle = C.dark; ctx.lineWidth = lw; ctx.stroke();
    ctx.restore();
  };

  if (w < 0.5) { body(); tail(); } else { tail(); body(); }

  // front paws show once the cat sits up
  if (w > 0.5) {
    ctx.globalAlpha *= (w - 0.5) * 2;
    for (const d of [-1, 1]) {
      oval(d * s * 0.1, by + bry * 0.86, s * 0.075, s * 0.05);
      ctx.fillStyle = key === "k" ? C.light : C.fur; ctx.fill();
      ctx.strokeStyle = C.dark; ctx.lineWidth = lw; ctx.stroke();
    }
    ctx.globalAlpha /= (w - 0.5) * 2;
  }

  // ears (they perk up when awake)
  for (const d of [-1, 1]) {
    const tipY = hy - hr * (1.36 + 0.1 * w);
    ctx.beginPath();
    ctx.moveTo(hx + d * hr * 0.98, hy - hr * 0.2);
    ctx.lineTo(hx + d * hr * 0.8, tipY);
    ctx.lineTo(hx + d * hr * 0.08, hy - hr * 0.84);
    ctx.closePath();
    ctx.fillStyle = C.ear || C.fur; ctx.fill();
    ctx.strokeStyle = C.dark; ctx.lineWidth = lw; ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(hx + d * hr * 0.8, hy - hr * 0.5);
    ctx.lineTo(hx + d * hr * 0.74, tipY + hr * 0.3);
    ctx.lineTo(hx + d * hr * 0.36, hy - hr * 0.78);
    ctx.closePath();
    ctx.fillStyle = "#FF9DB5"; ctx.fill();
  }
  // Eda's sprout
  if (key === "m") {
    ctx.strokeStyle = C.dark; ctx.lineWidth = lw;
    ctx.beginPath(); ctx.moveTo(hx, hy - hr * 0.9); ctx.lineTo(hx, hy - hr * 1.3); ctx.stroke();
    for (const d of [-1, 1]) {
      oval(hx + d * hr * 0.2, hy - hr * 1.38, hr * 0.22, hr * 0.12, d * -0.5);
      ctx.fillStyle = "#A6F07F"; ctx.fill(); ctx.stroke();
    }
  }
  // head
  oval(hx, hy, hr * 1.08, hr * 0.94); ctx.fillStyle = C.fur; ctx.fill();
  ctx.save(); ctx.clip();
  if (key === "o") {
    ctx.strokeStyle = C.dark; ctx.lineWidth = s * 0.04;
    [-0.32, 0, 0.32].forEach(k => {
      ctx.beginPath(); ctx.moveTo(hx + k * hr, hy - hr); ctx.lineTo(hx + k * hr * 0.8, hy - hr * 0.52); ctx.stroke();
    });
  } else if (key === "w") {
    ctx.fillStyle = "#FFCB7A"; oval(hx + hr * 0.62, hy - hr * 0.42, hr * 0.5, hr * 0.5); ctx.fill();
  } else if (key === "p") {
    ctx.fillStyle = C.light; oval(hx, hy + hr * 0.45, hr * 0.62, hr * 0.48); ctx.fill();
  }
  if (key === "b" || key === "m") {
    ctx.fillStyle = C.light; oval(hx, hy + hr * 0.52, hr * 0.5, hr * 0.36); ctx.fill();
  }
  if (key === "k") {                         // Bean: white muzzle and a white blaze up the nose
    ctx.fillStyle = C.light;
    oval(hx, hy + hr * 0.6, hr * 0.66, hr * 0.5); ctx.fill();
    oval(hx, hy - hr * 0.12, hr * 0.17, hr * 0.62); ctx.fill();
  }
  // shine
  ctx.fillStyle = "rgba(255,255,255,0.32)"; oval(hx - hr * 0.42, hy - hr * 0.5, hr * 0.3, hr * 0.14, -0.5); ctx.fill();
  ctx.restore();
  oval(hx, hy, hr * 1.08, hr * 0.94); ctx.strokeStyle = C.dark; ctx.lineWidth = lw; ctx.stroke();

  // blush
  ctx.fillStyle = "rgba(255, 105, 140, 0.42)";
  for (const d of [-1, 1]) { oval(hx + d * hr * 0.66, hy + hr * 0.4, hr * 0.2, hr * 0.12); ctx.fill(); }

  // eyes: closed curves asleep, big and shiny awake
  ctx.strokeStyle = C.face; ctx.fillStyle = C.face; ctx.lineWidth = lw * 1.1;
  const open = clamp01((w - 0.4) / 0.4);
  for (const d of [-1, 1]) {
    const ex = hx + d * hr * 0.42, ey = hy + hr * 0.1;
    if (open <= 0) {
      ctx.strokeStyle = C.lid || C.face;
      ctx.beginPath(); ctx.arc(ex, ey - hr * 0.1, hr * 0.2, 0.12 * Math.PI, 0.88 * Math.PI); ctx.stroke();
    } else {
      oval(ex, ey, hr * 0.17, hr * 0.21 * Math.max(0.15, open)); ctx.fillStyle = C.eye || C.face; ctx.fill();
      if (C.eye) { oval(ex, ey, hr * 0.085, hr * 0.17 * Math.max(0.15, open)); ctx.fillStyle = C.dark; ctx.fill(); }
      if (open > 0.6) {
        ctx.fillStyle = "#FFFFFF";
        oval(ex + hr * 0.05, ey - hr * 0.08, hr * 0.07, hr * 0.07); ctx.fill();
        oval(ex - hr * 0.06, ey + hr * 0.07, hr * 0.035, hr * 0.035); ctx.fill();
      }
    }
  }
  // nose and mouth
  ctx.fillStyle = "#FF6F8E";
  ctx.beginPath();
  ctx.moveTo(hx - hr * 0.1, hy + hr * 0.34); ctx.lineTo(hx + hr * 0.1, hy + hr * 0.34); ctx.lineTo(hx, hy + hr * 0.47);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = C.face; ctx.lineWidth = lw * 0.8;
  if (open > 0.6) {
    ctx.beginPath(); ctx.arc(hx, hy + hr * 0.52, hr * 0.16, 0, Math.PI); ctx.closePath();
    ctx.fillStyle = "#D1345B"; ctx.fill(); ctx.stroke();
  } else {
    ctx.beginPath();
    ctx.arc(hx - hr * 0.1, hy + hr * 0.5, hr * 0.1, 0, Math.PI * 0.9);
    ctx.moveTo(hx + hr * 0.2, hy + hr * 0.5);
    ctx.arc(hx + hr * 0.1, hy + hr * 0.5, hr * 0.1, 0, Math.PI * 0.9);
    ctx.stroke();
  }
  ctx.restore();
}

/* ---------- beds ---------- */
function bedPath(ox, oy, cells, inset, radius) {
  const s = cell, has = (r, c) => cells.some(([a, b]) => a === r && b === c);
  ctx.beginPath();
  for (const [r, c] of cells) {
    const x = ox + c * s, y = oy + r * s;
    addRR(x + inset, y + inset, s - inset * 2, s - inset * 2, radius);
    const right = has(r, c + 1), down = has(r + 1, c);
    if (right) ctx.rect(x + s / 2, y + inset, s, s - inset * 2);
    if (down) ctx.rect(x + inset, y + s / 2, s - inset * 2, s);
    if (right && down && has(r + 1, c + 1)) ctx.rect(x + s / 2, y + s / 2, s, s);
  }
}

function drawBed(bed, lifted) {
  const C = CATS[bed.color], s = cell;
  const going = bed.need === 0;
  const lt = going ? bed.leaveT : 0;
  const wake = going ? clamp01(lt / 0.3) : 0;
  const fade = going ? clamp01((lt - 0.65) / 0.3) : 0;
  let ox = gx + (bed.x + bed.nx) * s, oy = gy + (bed.y + bed.ny) * s - fade * s * 0.3;
  ctx.save();
  if (going) {
    const [mr, mc] = bed.cells.reduce((m, [r, c]) => [Math.max(m[0], r), Math.max(m[1], c)], [0, 0]);
    const cx = ox + (mc + 1) * s / 2, cy = oy + (mr + 1) * s / 2;
    const grow = 1 + Math.sin(clamp01(lt / 0.3) * Math.PI) * 0.1;
    ctx.translate(cx, cy); ctx.scale(grow, grow); ctx.translate(-cx, -cy);
  }
  const alpha = 1 - fade;
  ctx.globalAlpha = alpha;
  const pad = s * 0.05, rim = Math.max(2.5, s * 0.06);
  // shadow
  ctx.fillStyle = "rgba(20, 28, 90, 0.3)";
  bedPath(ox, oy + (lifted ? 9 : 4), bed.cells, pad, s * 0.26); ctx.fill();
  if (lifted) oy -= 3;
  // rim, cushion, soft middle
  ctx.fillStyle = C.dark; bedPath(ox, oy, bed.cells, pad, s * 0.26); ctx.fill();
  ctx.fillStyle = C.bed; bedPath(ox, oy, bed.cells, pad + rim, s * 0.21); ctx.fill();
  ctx.fillStyle = C.bedIn || C.light; bedPath(ox, oy, bed.cells, pad + rim + s * 0.1, s * 0.15); ctx.fill();

  // one spot per cat this bed holds
  const done = bed.total - bed.need;
  bed.cells.forEach(([r, c], j) => {
    if (j >= bed.total) return;
    const cx = ox + (c + 0.5) * s, cy = oy + (r + 0.5) * s;
    if (j < done) {
      const f = Math.min(1, bed.fills[j] === undefined ? 1 : bed.fills[j]);
      const pop = f < 1 ? 0.5 + 0.5 * f + Math.sin(f * Math.PI) * 0.18 : 1;
      drawCat(cx, cy, s * 0.84, bed.color, { seed: bed.id * 3 + j, scale: pop, wake, noShadow: true });
    } else {
      ctx.globalAlpha = alpha * (shapesOn ? 0.75 : 0.45); ctx.fillStyle = C.bed;
      if (shapesOn) drawShape(bed.color, cx, cy, s * 0.15); else paw(cx, cy, s * 0.24);
      ctx.globalAlpha = alpha;
    }
  });

  if (!going) {
    const [r0, c0] = bed.cells[0];
    const rad = Math.max(10, s * 0.185);
    // rails: arrows show the only way this bed slides
    if (bed.axis) {
      const q = Math.max(5.5, s * 0.105);
      ctx.save();
      ctx.translate(ox + c0 * s + s * 0.3, oy + r0 * s + s * 0.24);
      if (bed.axis === "v") ctx.rotate(Math.PI / 2);
      rr(-q * 2.2, -q * 1.15, q * 4.4, q * 2.3, q * 1.15);
      ctx.fillStyle = "#FFFFFF"; ctx.fill(); ctx.strokeStyle = C.dark; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.fillStyle = bed.color === "w" ? INK : C.dark;
      for (const d of [-1, 1]) {
        ctx.beginPath(); ctx.moveTo(d * q * 1.6, 0); ctx.lineTo(d * q * 0.45, -q * 0.7); ctx.lineTo(d * q * 0.45, q * 0.7); ctx.closePath(); ctx.fill();
      }
      ctx.restore();
    }
    const bx2 = ox + (c0 + 1) * s - s * 0.25, by2 = oy + r0 * s + s * 0.25;
    const locked = isLocked(bed), child = beds.find(b => b.lock === bed.id);
    if (locked) {
      // a grey veil and a padlock: this bed waits for its key
      ctx.fillStyle = "rgba(24, 30, 90, 0.38)"; bedPath(ox, oy, bed.cells, pad, s * 0.26); ctx.fill();
      const [pc, pd] = pairOf(bed.id);
      ctx.fillStyle = pd; oval(bx2, by2 + 1.5, rad + 2, rad + 2); ctx.fill();
      ctx.fillStyle = pc; oval(bx2, by2, rad, rad); ctx.fill();
      ctx.strokeStyle = "#FFFFFF"; ctx.lineWidth = rad * 0.22; ctx.lineCap = "round";
      ctx.beginPath(); ctx.arc(bx2, by2 - rad * 0.15, rad * 0.3, Math.PI, 0); ctx.stroke();
      ctx.fillStyle = "#FFFFFF"; rr(bx2 - rad * 0.48, by2 - rad * 0.15, rad * 0.96, rad * 0.68, rad * 0.16); ctx.fill();
    } else if (child) {
      // this bed carries the key for a locked bed
      const [pc, pd] = pairOf(child.id);
      ctx.fillStyle = pd; oval(bx2, by2 + 1.5, rad + 2, rad + 2); ctx.fill();
      ctx.fillStyle = pc; oval(bx2, by2, rad, rad); ctx.fill();
      ctx.strokeStyle = "#FFFFFF"; ctx.lineWidth = rad * 0.22; ctx.lineCap = "round";
      oval(bx2 - rad * 0.3, by2, rad * 0.24, rad * 0.24); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(bx2 - rad * 0.05, by2); ctx.lineTo(bx2 + rad * 0.6, by2);
      ctx.moveTo(bx2 + rad * 0.3, by2); ctx.lineTo(bx2 + rad * 0.3, by2 + rad * 0.3);
      ctx.moveTo(bx2 + rad * 0.55, by2); ctx.lineTo(bx2 + rad * 0.55, by2 + rad * 0.3); ctx.stroke();
    }
  }

  // tag: how many cats it still needs
  if (bed.need > 0) {
    const [tr, tc] = bed.cells[bed.cells.length - 1];
    const tx = ox + (tc + 1) * s - s * 0.2, ty = oy + (tr + 1) * s - s * 0.2, rad = Math.max(10, s * 0.19);
    ctx.fillStyle = C.dark; oval(tx, ty + 1.5, rad + 2.5, rad + 2.5); ctx.fill();
    ctx.fillStyle = "#FFFFFF"; oval(tx, ty, rad, rad); ctx.fill();
    ctx.fillStyle = bed.color === "w" ? INK : C.dark;
    ctx.font = `800 ${Math.round(rad * 1.4)}px ${FONT}`;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(String(bed.need), tx, ty + 1);
  }
  ctx.restore();
}

/* ---------- shared bits ---------- */
function drawBackground() {
  const T = theme();
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, T.bg[0]); g.addColorStop(1, T.bg[1]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // drifting beans
  ctx.fillStyle = "rgba(255, 255, 255, 0.4)";
  for (let i = 0; i < 10; i++) {
    const x = ((i * 137 + 20) % 100) / 100 * W;
    const y = (((i * 71 + 30) % 100) / 100 * H + time * (4 + i % 3)) % (H + 60) - 30;
    oval(x, y, 16 + (i % 3) * 7, 10 + (i % 3) * 4, 0.6 + i); ctx.fill();
  }
}

// One simple shape per color, so color is never the only clue.
function drawShape(key, x, y, r) {
  ctx.beginPath();
  if (key === "k") ctx.arc(x, y, r, 0, Math.PI * 2);
  else if (key === "o") { ctx.moveTo(x, y - r * 1.1); ctx.lineTo(x + r * 1.05, y + r * 0.8); ctx.lineTo(x - r * 1.05, y + r * 0.8); ctx.closePath(); }
  else if (key === "b") ctx.rect(x - r * 0.85, y - r * 0.85, r * 1.7, r * 1.7);
  else if (key === "w") { ctx.moveTo(x, y - r * 1.15); ctx.lineTo(x + r * 0.9, y); ctx.lineTo(x, y + r * 1.15); ctx.lineTo(x - r * 0.9, y); ctx.closePath(); }
  else if (key === "p") { for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, q = i % 2 ? r * 0.5 : r * 1.15; ctx.lineTo(x + Math.cos(a) * q, y + Math.sin(a) * q); } ctx.closePath(); }
  else { ctx.rect(x - r * 0.35, y - r, r * 0.7, r * 2); ctx.rect(x - r, y - r * 0.35, r * 2, r * 0.7); }
  ctx.fill();
}

function roundButton(x, y, size, icon, onTap, dim) {
  const cx = x + size / 2, cy = y + size / 2;
  ctx.globalAlpha = dim ? 0.45 : 1;
  ctx.fillStyle = "#8FB4E3"; oval(cx, cy + 4, size / 2, size / 2); ctx.fill();
  ctx.fillStyle = "#FFFFFF"; oval(cx, cy, size / 2, size / 2); ctx.fill();
  ctx.strokeStyle = INK; ctx.fillStyle = INK; ctx.lineWidth = 3; ctx.lineCap = "round"; ctx.lineJoin = "round";
  const k = size / 44;
  if (icon === "restart") {
    ctx.beginPath(); ctx.arc(cx, cy, 10 * k, -0.3 * Math.PI, 1.35 * Math.PI); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx + 6 * k, cy - 13 * k); ctx.lineTo(cx + 9 * k, cy - 7 * k); ctx.lineTo(cx + 3 * k, cy - 5 * k); ctx.stroke();
  } else if (icon === "undo") {
    ctx.beginPath(); ctx.moveTo(cx - 9 * k, cy - 3 * k); ctx.lineTo(cx + 3 * k, cy - 3 * k);
    ctx.arc(cx + 3 * k, cy + 3 * k, 6 * k, -0.5 * Math.PI, 0.5 * Math.PI); ctx.lineTo(cx - 4 * k, cy + 9 * k); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx - 4 * k, cy - 8 * k); ctx.lineTo(cx - 9 * k, cy - 3 * k); ctx.lineTo(cx - 4 * k, cy + 2 * k); ctx.stroke();
  } else if (icon === "levels") {
    for (let i = 0; i < 2; i++) for (let j = 0; j < 2; j++) { rr(cx - 10 * k + j * 11 * k, cy - 10 * k + i * 11 * k, 9 * k, 9 * k, 2.5); ctx.fill(); }
  } else if (icon === "left" || icon === "right") {
    const d = icon === "left" ? -1 : 1;
    ctx.beginPath(); ctx.moveTo(cx - d * 4, cy - 8); ctx.lineTo(cx + d * 4, cy); ctx.lineTo(cx - d * 4, cy + 8); ctx.stroke();
  } else if (icon === "settings") {
    ctx.lineWidth = 2.6;
    for (let i = -1; i <= 1; i++) {
      ctx.beginPath(); ctx.moveTo(cx - 10 * k, cy + i * 7 * k); ctx.lineTo(cx + 10 * k, cy + i * 7 * k); ctx.stroke();
      oval(cx + (i === 0 ? 4 : -4) * k, cy + i * 7 * k, 3.2 * k, 3.2 * k);
      ctx.fillStyle = "#FFFFFF"; ctx.fill(); ctx.stroke(); ctx.fillStyle = INK;
    }
  } else if (icon === "sound") {
    ctx.beginPath(); ctx.moveTo(cx - 10 * k, cy - 3 * k); ctx.lineTo(cx - 5 * k, cy - 3 * k); ctx.lineTo(cx, cy - 8 * k);
    ctx.lineTo(cx, cy + 8 * k); ctx.lineTo(cx - 5 * k, cy + 3 * k); ctx.lineTo(cx - 10 * k, cy + 3 * k); ctx.closePath(); ctx.fill();
    ctx.lineWidth = 2.5;
    if (soundOn) {
      ctx.beginPath(); ctx.arc(cx + 1 * k, cy, 6 * k, -0.3 * Math.PI, 0.3 * Math.PI); ctx.stroke();
      ctx.beginPath(); ctx.arc(cx + 1 * k, cy, 10.5 * k, -0.3 * Math.PI, 0.3 * Math.PI); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.moveTo(cx + 4 * k, cy - 4 * k); ctx.lineTo(cx + 11 * k, cy + 4 * k);
      ctx.moveTo(cx + 11 * k, cy - 4 * k); ctx.lineTo(cx + 4 * k, cy + 4 * k); ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
  if (!dim) buttons.push({ x: x - 4, y: y - 4, w: size + 8, h: size + 12, onTap });
}

function pillButton(x, y, w, h, label, onTap, primary) {
  rr(x, y + 5, w, h, h / 2); ctx.fillStyle = primary ? "#D4620A" : "#8FB4E3"; ctx.fill();
  rr(x, y, w, h, h / 2); ctx.fillStyle = primary ? "#FF8A1F" : "#E6EEFF"; ctx.fill();
  if (primary) { rr(x + 6, y + 4, w - 12, h * 0.4, h * 0.2); ctx.fillStyle = "rgba(255,255,255,0.22)"; ctx.fill(); }
  ctx.fillStyle = primary ? "#FFFFFF" : INK;
  ctx.font = `800 ${Math.round(h * 0.38)}px ${FONT}`;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(label, x + w / 2, y + h / 2 + 1);
  buttons.push({ x, y, w, h: h + 5, onTap });
}

function toggleSound() { soundOn = !soundOn; writeStore("dropthebean.sound", soundOn ? "on" : "off"); }
function toggleMusic() { musicOn = !musicOn; writeStore("dropthebean.music", musicOn ? "on" : "off"); if (musicOn) audio(); }
function toggleTimer() { timerMode = !timerMode; writeStore("dropthebean.timer", timerMode ? "on" : "off"); }
function toggleShapes() { shapesOn = !shapesOn; writeStore("dropthebean.shapes", shapesOn ? "on" : "off"); }
function cycleTheme() {
  const open = THEMES.filter(t => totalStars() >= t.stars);
  themeId = open[(open.indexOf(theme()) + 1) % open.length].id;
  writeStore("dropthebean.theme", themeId);
}
const clock = s => { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); };
const nextUnsolved = () => { for (let i = 0; i < LEVELS.length; i++) if (!progress[i]) return i; return 0; };
const totalStars = () => Object.values(progress).reduce((a, b) => a + b, 0);

function logo(text, x, y, size) {
  ctx.font = `900 ${size}px ${FONT}`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.lineJoin = "round";
  ctx.strokeStyle = "#1F57B0"; ctx.lineWidth = size * 0.3; ctx.strokeText(text, x, y + size * 0.09);
  ctx.strokeStyle = INK; ctx.lineWidth = size * 0.2; ctx.strokeText(text, x, y);
  ctx.fillStyle = "#FFFFFF"; ctx.fillText(text, x, y);
}

/* ---------- home screen ---------- */
function drawMenu() {
  const s = safeArea();
  const roomy = H - s.t - s.b > 740;
  let y = topY + (roomy ? 6 : 0);

  roundButton(18, topY + 4, 40, "settings", () => { settingsOpen = true; });
  roundButton(W - 18 - 40, topY + 4, 40, "sound", toggleSound);

  // mascot: Bean asleep on a cushion
  const ms = roomy ? 92 : 58;
  ctx.fillStyle = "rgba(20, 28, 90, 0.18)"; oval(W / 2, y + ms * 0.7, ms * 0.62, ms * 0.3); ctx.fill();
  ctx.fillStyle = "#B9590A"; oval(W / 2, y + ms * 0.64, ms * 0.62, ms * 0.3); ctx.fill();
  ctx.fillStyle = "#FF8A1F"; oval(W / 2, y + ms * 0.62, ms * 0.56, ms * 0.25); ctx.fill();
  ctx.fillStyle = "#FFE3B8"; oval(W / 2, y + ms * 0.61, ms * 0.44, ms * 0.17); ctx.fill();
  drawCat(W / 2, y + ms * 0.44, ms, "k", { seed: 1, noShadow: true });
  const zt = (time * 0.5) % 1;
  ctx.globalAlpha = Math.sin(zt * Math.PI) * 0.9; ctx.fillStyle = INK;
  ctx.font = `800 ${Math.round(14 + zt * 8)}px ${FONT}`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText("z", W / 2 + ms * (0.44 + zt * 0.12), y + ms * (0.16 - zt * 0.2));
  ctx.globalAlpha = 1;
  y += ms + (roomy ? 10 : 2);

  logo("Drop the Bean", W / 2, y + 16, roomy ? 36 : 28);
  y += roomy ? 48 : 38;

  // Play + stars
  const next = nextUnsolved();
  const pw = Math.min(220, W - 150);
  pillButton(W / 2 - pw / 2 - 38, y, pw, 48, `Play level ${next + 1}`, () => startLevel(next), true);
  const sx = W / 2 + pw / 2 - 26;
  rr(sx, y + 5, 76, 38, 19); ctx.fillStyle = "#FFFFFF"; ctx.fill();
  drawStar(sx + 20, y + 24, 10, true);
  ctx.fillStyle = INK; ctx.font = `800 16px ${FONT}`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(String(totalStars()), sx + 50, y + 25);
  y += 62;

  // one fresh puzzle a day, with a streak
  const dw = Math.min(pw + 86, W - 48), streak = dailyStreak();
  const dLabel = dailyDone() ? `Daily nap done. Streak: ${streak}` : streak ? `Daily nap. Streak: ${streak}` : "Daily nap";
  pillButton(W / 2 - dw / 2, y, dw, 40, dLabel, () => startLevel(dailyIndex(), true), false);
  y += 56;

  // level buttons
  const colsN = 5, gap = 10;
  const pagerH = 54, castH = roomy ? 84 : 0;
  const roomH = H - s.b - y - pagerH - castH - 6;
  const bs = Math.floor(Math.min(62, (W - 40 - gap * (colsN - 1)) / colsN, (roomH - gap * 4) / 5));
  const gw = colsN * bs + (colsN - 1) * gap, x0 = (W - gw) / 2;
  const pages = Math.max(1, Math.ceil(LEVELS.length / PER_PAGE));
  for (let i = 0; i < PER_PAGE; i++) {
    const n = page * PER_PAGE + i;
    if (n >= LEVELS.length) break;
    const bx = x0 + (i % colsN) * (bs + gap), by = y + Math.floor(i / colsN) * (bs + gap);
    const stars = progress[n] || 0, isNext = n === next;
    rr(bx, by + 4, bs, bs, 16); ctx.fillStyle = stars ? "#E0A419" : isNext ? "#D4620A" : "#8FB4E3"; ctx.fill();
    rr(bx, by, bs, bs, 16); ctx.fillStyle = stars ? "#FFF0B3" : isNext ? "#FF8A1F" : "#FFFFFF"; ctx.fill();
    ctx.fillStyle = isNext && !stars ? "#FFFFFF" : INK; ctx.font = `800 ${Math.round(bs * 0.36)}px ${FONT}`;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(String(n + 1), bx + bs / 2, by + bs * (stars ? 0.4 : 0.52));
    if (stars) for (let k = 0; k < 3; k++) drawStar(bx + bs / 2 + (k - 1) * bs * 0.24, by + bs * 0.76, bs * 0.1, k < stars);
    buttons.push({ x: bx, y: by, w: bs, h: bs + 4, onTap: () => startLevel(n) });
  }
  y += 5 * (bs + gap) + 2;

  // pager
  if (pages > 1) {
    roundButton(W / 2 - 122, y + 2, 40, "left", () => { page--; }, page === 0);
    roundButton(W / 2 + 82, y + 2, 40, "right", () => { page++; }, page === pages - 1);
    ctx.fillStyle = INK; ctx.font = `800 16px ${FONT}`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(CHAPTER_NAMES[page] || `Chapter ${page + 1}`, W / 2, y + 14);
    ctx.fillStyle = SOFT; ctx.font = `700 12px ${FONT}`;
    ctx.fillText(`Levels ${page * PER_PAGE + 1} to ${Math.min(LEVELS.length, (page + 1) * PER_PAGE)}`, W / 2, y + 33);
  }
  y += pagerH;

  // meet the cast: they take turns waking up
  if (castH) {
    const step = Math.min(58, (W - 32) / CAST.length);
    const cx0 = W / 2 - step * (CAST.length - 1) / 2;
    const turn = Math.floor(time / 2.2) % CAST.length, phase = (time % 2.2) / 2.2;
    CAST.forEach((k, i) => {
      const wake = i === turn ? clamp01(Math.sin(phase * Math.PI) * 2.2) : 0;
      drawCat(cx0 + i * step, y + 24, 48, k, { seed: i * 1.7, wake });
      ctx.fillStyle = INK; ctx.font = `700 11px ${FONT}`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(CATS[k].name, cx0 + i * step, y + 60);
    });
  }

  if (settingsOpen) drawSettings();
}

function drawSettings() {
  buttons = [];                                   // nothing behind the card can be tapped
  ctx.fillStyle = "rgba(20, 26, 80, 0.5)"; ctx.fillRect(0, 0, W, H);
  const cw = Math.min(320, W - 40), rowH = 54;
  const ch = 66 + 5 * rowH + 96;
  const x = (W - cw) / 2, y = Math.max(topY + 8, (H - ch) / 2);
  rr(x, y + 8, cw, ch, 28); ctx.fillStyle = "rgba(10,16,60,0.25)"; ctx.fill();
  rr(x, y, cw, ch, 28); ctx.fillStyle = "#FFFFFF"; ctx.fill();
  ctx.fillStyle = INK; ctx.font = `900 26px ${FONT}`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText("Settings", W / 2, y + 38);
  const row = (i, label, onTap) => pillButton(x + 24, y + 66 + i * rowH, cw - 48, 44, label, onTap, false);
  row(0, `Sound: ${soundOn ? "On" : "Off"}`, toggleSound);
  row(1, `Music: ${musicOn ? "On" : "Off"}`, toggleMusic);
  row(2, timerMode ? "Timer: On" : "Timer: Off (relaxed)", toggleTimer);
  row(3, `Color shapes: ${shapesOn ? "On" : "Off"}`, toggleShapes);
  row(4, `Board: ${theme().name}`, cycleTheme);
  const nextT = THEMES.find(t => totalStars() < t.stars);
  ctx.fillStyle = SOFT; ctx.font = `700 13px ${FONT}`; ctx.textAlign = "center";
  ctx.fillText(nextT ? `Next board, ${nextT.name}, at ${nextT.stars} stars` : "All boards unlocked", W / 2, y + 66 + 5 * rowH + 10);
  pillButton(x + 24, y + 66 + 5 * rowH + 30, cw - 48, 48, "Done", () => { settingsOpen = false; }, true);
}

/* ---------- tutorial finger ---------- */
function drawGuide() {
  if (drag || overlay || leaving.length || guideIdx >= guideRuns.length) return;
  const g = guideRuns[guideIdx], bed = beds.find(b => b.id === g.bed);
  if (!bed || bed.r !== g.start[0] || bed.c !== g.start[1]) return;      // player went their own way
  const [mr, mc] = bed.cells.reduce((m, [r, c]) => [Math.max(m[0], r), Math.max(m[1], c)], [0, 0]);
  const pts = [[gx + (bed.c + (mc + 1) / 2) * cell, gy + (bed.r + (mr + 1) / 2) * cell]];
  for (const [dr, dc] of g.path) { const q = pts[pts.length - 1]; pts.push([q[0] + dc * cell, q[1] + dr * cell]); }
  const ph = (time % 2.4) / 2.4;
  const travel = clamp01((ph - 0.18) / 0.6), along = travel * (pts.length - 1);
  const i = Math.min(pts.length - 2, Math.floor(along)), f = along - i;
  const x = lerp(pts[i][0], pts[i + 1][0], f), y = lerp(pts[i][1], pts[i + 1][1], f);
  const a = ph < 0.1 ? ph / 0.1 : ph > 0.88 ? (1 - ph) / 0.12 : 1;
  ctx.save(); ctx.globalAlpha = a * 0.95;
  // dotted trail
  ctx.strokeStyle = "rgba(255,255,255,0.95)"; ctx.lineWidth = 5; ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.setLineDash([2, 10]);
  ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
  for (let k = 1; k <= i; k++) ctx.lineTo(pts[k][0], pts[k][1]);
  ctx.lineTo(x, y); ctx.stroke(); ctx.setLineDash([]);
  // finger
  if (ph > 0.1 && ph < 0.86) {
    ctx.strokeStyle = "rgba(255,255,255,0.85)"; ctx.lineWidth = 3;
    oval(x, y, 20 + Math.sin(time * 6) * 2, 20 + Math.sin(time * 6) * 2); ctx.stroke();
  }
  ctx.fillStyle = "#FFFFFF"; ctx.strokeStyle = INK; ctx.lineWidth = 3;
  ctx.translate(x + 6, y + 8); ctx.rotate(-0.35);
  rr(-8, -14, 16, 34, 8); ctx.fill(); ctx.stroke();
  rr(-14, 8, 30, 24, 10); ctx.fill(); ctx.stroke();
  ctx.fillStyle = "#FFFFFF"; ctx.fillRect(-6.5, 6, 13, 8);
  ctx.restore();
}

/* ---------- the game screen ---------- */
function drawGame() {
  // top row
  roundButton(18, topY + 6, 44, "levels", () => { screen = "menu"; page = Math.floor(levelIndex / PER_PAGE); overlay = null; });
  roundButton(W - 18 - 44, topY + 6, 44, "restart", () => startLevel(levelIndex));
  ctx.fillStyle = INK; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.font = `900 26px ${FONT}`;
  ctx.fillText(isDaily ? "Daily nap" : `Level ${levelIndex + 1}`, W / 2, topY + 28);

  // second row: undo, timer, cats left, sound
  const low = timerMode && timeLeft <= 10 && timerOn;
  const ph = 38, py = topY + 66, gap = 8;
  const pw = Math.min(108, (W - 36 - 80 - gap * 3) / 2);
  roundButton(18, py - 1, 40, "undo", undo, !history.length || !!overlay);
  roundButton(W - 18 - 40, py - 1, 40, "sound", toggleSound);
  let px = W / 2 - pw - gap / 2;
  const pulse = low ? 1 + Math.sin(time * 12) * 0.04 : 1;
  ctx.save(); ctx.translate(px + pw / 2, py + ph / 2); ctx.scale(pulse, pulse); ctx.translate(-px - pw / 2, -py - ph / 2);
  rr(px, py + 3, pw, ph, ph / 2); ctx.fillStyle = low ? "#C22B3F" : "#8FB4E3"; ctx.fill();
  rr(px, py, pw, ph, ph / 2); ctx.fillStyle = low ? "#FF5C72" : "#FFFFFF"; ctx.fill();
  const tc = low ? "#FFFFFF" : INK;
  ctx.strokeStyle = tc; ctx.lineWidth = 2.4; ctx.lineCap = "round";
  ctx.fillStyle = tc; ctx.textAlign = "center";
  if (timerMode) {
    oval(px + 22, py + ph / 2, 9, 9); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(px + 22, py + ph / 2 - 5); ctx.lineTo(px + 22, py + ph / 2); ctx.lineTo(px + 26, py + ph / 2 + 2); ctx.stroke();
    ctx.font = `800 18px ${FONT}`;
    ctx.fillText(clock(timeLeft), px + pw / 2 + 13, py + ph / 2 + 1);
  } else {
    ctx.font = `800 16px ${FONT}`;            // relaxed mode: count slides, no clock
    ctx.fillText(`${slides} ${slides === 1 ? "slide" : "slides"}`, px + pw / 2, py + ph / 2 + 1);
  }
  ctx.restore();

  px = W / 2 + gap / 2;
  rr(px, py + 3, pw, ph, ph / 2); ctx.fillStyle = "#8FB4E3"; ctx.fill();
  rr(px, py, pw, ph, ph / 2); ctx.fillStyle = "#FFFFFF"; ctx.fill();
  ctx.fillStyle = "#FF8A1F"; paw(px + 23, py + ph / 2 - 1, 15);
  ctx.fillStyle = INK; ctx.font = `800 18px ${FONT}`; ctx.textAlign = "center";
  ctx.fillText(`${catsLeft} left`, px + pw / 2 + 13, py + ph / 2 + 1);

  // board: deep blue tray with pale tiles
  const TH = theme();
  const bw = cols * cell, bh = rows * cell, m = 12;
  rr(gx - m, gy - m + 8, bw + m * 2, bh + m * 2, 24); ctx.fillStyle = TH.trayDark; ctx.fill();
  rr(gx - m, gy - m, bw + m * 2, bh + m * 2, 24); ctx.fillStyle = TH.tray; ctx.fill();
  rr(gx - m + 4, gy - m + 4, bw + m * 2 - 8, 10, 6); ctx.fillStyle = "rgba(255,255,255,0.16)"; ctx.fill();
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const x = gx + c * cell, y = gy + r * cell;
    if (walls[r][c]) {
      rr(x + 3, y + 5, cell - 6, cell - 6, cell * 0.2); ctx.fillStyle = TH.wallDark; ctx.fill();
      rr(x + 3, y + 1, cell - 6, cell - 6, cell * 0.2); ctx.fillStyle = TH.wall; ctx.fill();
      rr(x + 8, y + 5, cell - 16, (cell - 6) * 0.3, cell * 0.12); ctx.fillStyle = "rgba(255,255,255,0.18)"; ctx.fill();
    } else {
      rr(x + 1.5, y + 1.5, cell - 3, cell - 3, cell * 0.16);
      ctx.fillStyle = TH.tiles[(r + c) % 2]; ctx.fill();
    }
  }

  // sleeping cats on the floor. The ones the held bed can take glow softly.
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const cat = floorCats[r][c];
    if (!cat) continue;
    const cx = gx + (c + 0.5) * cell, cy = gy + (r + 0.5) * cell;
    const match = !!drag && drag.bed.color === cat.color;
    if (match) {
      ctx.fillStyle = CATS[cat.color].bed; ctx.globalAlpha = 0.28 + Math.sin(time * 7) * 0.1;
      rr(cx - cell / 2 + 3, cy - cell / 2 + 3, cell - 6, cell - 6, cell * 0.16); ctx.fill(); ctx.globalAlpha = 1;
    }
    drawCat(cx, cy, cell * 0.95, cat.color, { seed: cat.seed, wake: overlay && overlay.kind === "lose" ? clamp01(overlay.t * 3) : 0, still: true });
    if (shapesOn) {
      const sx = cx + cell * 0.3, sy = cy + cell * 0.3, sr = cell * 0.15;
      ctx.fillStyle = CATS[cat.color].dark; oval(sx, sy, sr + 1.5, sr + 1.5); ctx.fill();
      ctx.fillStyle = "#FFFFFF"; oval(sx, sy, sr, sr); ctx.fill();
      ctx.fillStyle = cat.color === "w" ? INK : CATS[cat.color].bed; drawShape(cat.color, sx, sy, sr * 0.58);
    }
  }

  for (const b of leaving) drawBed(b, false);            // under the others, so nothing hides a live bed
  for (const b of beds) if (!drag || drag.bed !== b) drawBed(b, false);
  if (drag) drawBed(drag.bed, true);

  // effects
  for (const f of effects) {
    const a = Math.max(0, f.life / f.max);
    ctx.globalAlpha = a;
    if (f.type === "heart") { ctx.fillStyle = f.color; drawHeart(f.x, f.y, cell * 0.26); }
    else {
      ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.rot);
      ctx.fillStyle = "#FFFFFF"; ctx.strokeStyle = f.color; ctx.lineWidth = 2;
      ctx.beginPath();
      for (let i = 0; i < 8; i++) { const rad = i % 2 ? 2.5 : 7 * a + 2; const an = i * Math.PI / 4; ctx.lineTo(Math.cos(an) * rad, Math.sin(an) * rad); }
      ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  if (!touched || L.guide) drawGuide();

  // hint for the teaching levels
  if (L.hint && !overlay) {
    const s = safeArea(), hy = H - s.b - 62;
    ctx.fillStyle = INK; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = `700 16px ${FONT}`;
    L.hint.forEach((line, i) => ctx.fillText(line, W / 2, hy + i * 24));
  }

  if (overlay && overlay.delay <= 0) drawOverlay();
}

function drawOverlay() {
  const o = overlay, a = Math.min(1, o.t * 4), win = o.kind === "win";
  ctx.fillStyle = `rgba(20, 26, 80, ${0.5 * a})`; ctx.fillRect(0, 0, W, H);

  for (const c of confetti) {
    ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.rot);
    ctx.fillStyle = c.color; ctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h); ctx.restore();
  }

  const cw = Math.min(320, W - 40), ch = 348;
  const x = (W - cw) / 2, y = (H - ch) / 2 + 20 + (1 - a) * 40;
  ctx.globalAlpha = a;

  // the level's cats sit on top of the card: awake after a win
  const kinds = [...new Set(L.beds.map(b => b.color))].slice(0, 5);
  const step = Math.min(62, (cw - 40) / kinds.length);
  kinds.forEach((k, i) => {
    drawCat(W / 2 + (i - (kinds.length - 1) / 2) * step, y - 22, 64, k,
      { seed: i * 0.7, wake: win ? clamp01(o.t * 3 - i * 0.2) : 0, noShadow: true });
  });

  rr(x, y + 8, cw, ch, 28); ctx.fillStyle = "rgba(10,16,60,0.25)"; ctx.fill();
  rr(x, y, cw, ch, 28); ctx.fillStyle = "#FFFFFF"; ctx.fill();

  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillStyle = INK; ctx.font = `900 30px ${FONT}`;
  ctx.fillText(win ? "All tucked in!" : "Time's up!", W / 2, y + 46);
  if (win) {
    for (let i = 0; i < 3; i++) {
      const pop = Math.min(1, Math.max(0, (o.t - 0.2 - i * 0.18) * 5));
      drawStar(W / 2 + (i - 1) * 64, y + 110 - (i === 1 ? 10 : 0), 26 * (0.6 + 0.4 * pop), i < o.stars && pop > 0);
    }
    ctx.fillStyle = SOFT; ctx.font = `700 16px ${FONT}`;
    ctx.fillText(timerMode ? `Time left: ${clock(o.left)}` : `${slides} slides. Fewest possible: ${L.best}.`, W / 2, y + 160);
    ctx.fillStyle = "#D4620A"; ctx.font = `800 15px ${FONT}`;
    if (o.unlocked) ctx.fillText(`New board unlocked: ${o.unlocked.name}!`, W / 2, y + 185);
    else if (o.daily) ctx.fillText(`Daily streak: ${dailyStreak()} ${dailyStreak() === 1 ? "day" : "days"}`, W / 2, y + 185);
  } else {
    ctx.fillStyle = SOFT; ctx.font = `700 17px ${FONT}`;
    ctx.fillText(`${catsLeft} ${catsLeft === 1 ? "cat still needs" : "cats still need"} a bed.`, W / 2, y + 96);
    ctx.fillText("Give it another go.", W / 2, y + 124);
  }
  const home = () => { screen = "menu"; page = Math.floor(levelIndex / PER_PAGE); overlay = null; };
  const bw = cw - 56, hasNext = levelIndex + 1 < LEVELS.length;
  if (win && isDaily) pillButton(x + 28, y + 208, bw, 54, "Back home", home, true);
  else if (win && hasNext) pillButton(x + 28, y + 208, bw, 54, "Next level", () => startLevel(levelIndex + 1), true);
  else pillButton(x + 28, y + 208, bw, 54, win ? "Play again" : "Try again", () => startLevel(levelIndex, isDaily), true);
  if (!(win && isDaily)) pillButton(x + 28, y + 278, bw, 46, "All levels", home, false);
  ctx.globalAlpha = 1;
}

/* ---------- loop ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now; time += dt;

  if (screen === "game") {
    while (guideIdx < guideRuns.length) {               // move the finger demo on as the player follows it
      const g = guideRuns[guideIdx], gb = beds.find(b => b.id === g.bed);
      if (!gb || (gb.r === g.end[0] && gb.c === g.end[1])) guideIdx++; else break;
    }
    if (timerOn && !overlay && timerMode) {
      timeLeft -= dt;
      if (timeLeft <= 10 && Math.ceil(timeLeft) !== lastTick) { lastTick = Math.ceil(timeLeft); if (timeLeft > 0) sfx.tick(); }
      if (timeLeft <= 0) { timeLeft = 0; finish("lose", 0.2); }
    }
    const ease = Math.min(1, dt * 26);
    for (const b of beds.concat(leaving)) {
      b.x += (b.c - b.x) * ease; b.y += (b.r - b.y) * ease;
      b.nx *= Math.max(0, 1 - dt * 14); b.ny *= Math.max(0, 1 - dt * 14);
      for (let i = 0; i < b.fills.length; i++) b.fills[i] = Math.min(1, b.fills[i] + dt * 4);
    }
    for (const b of leaving) b.leaveT += dt;
    leaving = leaving.filter(b => b.leaveT < LEAVE);
    for (const f of effects) { f.life -= dt; f.x += f.vx * dt; f.y += f.vy * dt; f.vy += 160 * dt; f.rot += dt * 5; }
    effects = effects.filter(f => f.life > 0);
    if (overlay) {
      if (overlay.delay > 0) overlay.delay -= dt;
      else {
        if (!overlay.rang) { overlay.rang = true; if (overlay.kind === "win") { sfx.win(); throwConfetti(); } else sfx.lose(); }
        overlay.t += dt;
      }
    }
    for (const c of confetti) { c.x += c.vx * dt; c.y += c.vy * dt; c.rot += c.spin * dt; }
    confetti = confetti.filter(c => c.y < H + 30);
  }

  musicTick();
  buttons = [];
  drawBackground();
  if (screen === "menu") drawMenu(); else drawGame();
  requestAnimationFrame(frame);
}

resize();
requestAnimationFrame(frame);

// On a real https address, keep a copy on the phone so it opens with no internet.
if ("serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register("sw.js").catch(() => { /* still playable online */ });
}
</script>
</body>
</html>
